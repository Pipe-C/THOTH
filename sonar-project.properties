sonar.organization=pipe-c
sonar.projectKey=Pipe-C_THOTH

# Rutas de código fuente de producción
sonar.sources=apps/backend/lib,apps/backend/api,apps/mobile/src

# Rutas de pruebas unitarias
sonar.tests=apps/backend/tests

# Exclusiones de análisis de duplicación (CPD)
sonar.cpd.exclusions=**/tests/**

# Exclusiones generales
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# Reporte de cobertura LCOV generado por Vitest
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info

# Exclusiones de cálculo de cobertura
sonar.coverage.exclusions=**/tests/**,**/types.ts,apps/mobile/**
